name: Deploy CompBase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          DEPLOY_BRANCH="${{ secrets.DEPLOY_BRANCH }}"
          if [ -z "$DEPLOY_BRANCH" ]; then DEPLOY_BRANCH="main"; fi

          ssh -o StrictHostKeyChecking=yes \
              -p ${{ secrets.VPS_PORT }} \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -e

            cd ${{ secrets.VPS_APP_DIR }}

            git fetch origin
            git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"

            pnpm install --frozen-lockfile

            pnpm --filter backend build
            pnpm --filter frontend build

            sudo systemctl restart compbase-backend
            sudo systemctl restart compbase-frontend

            sleep 5

            sudo systemctl is-active compbase-backend
            sudo systemctl is-active compbase-frontend

            curl -f http://127.0.0.1:4000/health
          EOF
