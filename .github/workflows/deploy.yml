name: Deploy CompBase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Create deploy bundle
        run: |
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="backend/.local" \
            --exclude="frontend/.next/cache" \
            -czf /tmp/compbase-deploy.tgz .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload deploy bundle
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -P ${{ secrets.VPS_PORT }} \
            /tmp/compbase-deploy.tgz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/compbase-deploy.tgz

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            RELEASE_DIR="/tmp/compbase-release"

            mkdir -p "$APP_DIR"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

            tar -xzf /tmp/compbase-deploy.tgz -C "$RELEASE_DIR"

            rsync -a --delete \
              --exclude ".env" \
              --exclude "backend/.local" \
              "$RELEASE_DIR"/ "$APP_DIR"/

            cd "$APP_DIR"

            pnpm install --frozen-lockfile

            rm -rf "$RELEASE_DIR" /tmp/compbase-deploy.tgz

            sudo systemctl daemon-reload
            sudo systemctl restart compbase-backend
            sudo systemctl restart compbase-frontend

            sleep 5

            sudo systemctl is-active compbase-backend
            sudo systemctl is-active compbase-frontend

            curl -f http://127.0.0.1:4100/health
          EOF